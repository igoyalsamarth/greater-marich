[project]
name = "greater-marich"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "samarth.goyal1999@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "bs-roformer-infer[mlx] @ git+https://github.com/openmirlab/bs-roformer-infer.git",
    "openai>=1.68.0",
    "pydantic-ai>=0.2.0",
    "pyannote-audio>=4.0.7",
    "python-dotenv>=1.0.0",
    "sarvamai>=0.1.30",
    "typer>=0.15.0",
    "yt-dlp>=2025.1.0",
    "transformers>=5.14.1",
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
    "loralib>=0.1.2",
    "speechbrain>=1.1.0",
]

[project.optional-dependencies]
chatterbox = [
    "chatterbox-tts>=0.1.7",
    "librosa>=0.10.2",
    "silero-vad>=5.1",
]

[project.scripts]
greater-marich = "main:main"

[tool.uv]
package = false
python-preference = "managed"
override-dependencies = [
    "transformers>=5.14.1",
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
    "safetensors>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
